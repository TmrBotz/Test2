version: "3.9"

services:
  movie-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-rss-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
    driver: local
